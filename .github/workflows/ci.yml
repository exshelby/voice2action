name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://voice2action:voice2action_ci@localhost:5432/voice2action?schema=public
      N8N_WEBHOOK_URL: http://localhost:5678/webhook/feedback-received
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: voice2action
          POSTGRES_USER: voice2action
          POSTGRES_PASSWORD: voice2action_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice2action -d voice2action"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npm run test:python
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Start application
        run: npm start > /tmp/voice2action.log 2>&1 &

      - name: Run HTTP smoke checks
        run: npm run smoke:local

      - name: Show application log after a failure
        if: failure()
        run: cat /tmp/voice2action.log || true
